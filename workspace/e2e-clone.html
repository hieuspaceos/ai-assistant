<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><title>Trang mẫu An Spa</title>
<style>
:root{--cs-font:sans-serif;--cs-primary:#2f6f5e;--cs-accent:#e8a87c;--cs-bg:#fdf8f2;--cs-text:#1d2b26;--cs-radius:16px;--cs-gap:24px}
body{margin:0;font-family:var(--cs-font);color:var(--cs-text);background:var(--cs-bg)}
.cs-wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.hero{background:#fdf3e7;padding:60px 0;text-align:center}
.hero h1{color:var(--cs-primary);font-size:40px;margin:0 0 10px}
.btn{display:inline-block;background:var(--cs-accent);color:#fff;padding:12px 28px;border-radius:30px;text-decoration:none}
.feats{display:flex;gap:var(--cs-gap);padding:50px 0;justify-content:center}
.feat{width:200px;text-align:center}
</style></head><body>
<section class="hero" data-cs="Hero đầu trang" data-cs-type="hero" data-cs-bg>
 <div class="cs-wrap">
  <h1 data-cs-text>Spa thư giãn mỗi ngày</h1>
  <a class="btn" href="#dat-lich" data-cs-link>Đặt lịch ngay</a>
 </div>
</section>
<section data-cs="Dịch vụ" data-cs-type="features">
 <div class="cs-wrap feats">
  <div class="feat"><h3 data-cs-text>Mặt nạ thảo dược</h3></div>
  <div class="feat"><h3 data-cs-text>Massage toàn thân</h3></div>
 </div>
</section>
</body></html>
