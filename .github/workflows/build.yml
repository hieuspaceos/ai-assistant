name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: |
          python tools/test-bridges.py
          python tools/test-parity.py
          python tools/test-packs.py
      - name: worker 2-tier (wrangler dev + D1 local)
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npm install -g wrangler@4.151.3 --no-fund --no-audit
          cd worker
          python3 - <<'EOF'
          import json, secrets
          orgs = {"CIORG": {k: secrets.token_hex(24)
                            for k in ("beacon_secret", "license_secret",
                                      "admin_key")}}
          open(".dev.vars", "w").write(
              "VENDOR_KEY=" + secrets.token_hex(24)
              + "\nORGS_JSON=" + json.dumps(orgs) + "\n")
          EOF
          cd .. && python tools/test-worker.py

  # S4 — smoke test vung cat Windows: lint .ps1, tao user han che +
  # ACL that, spawn cross-user qua AgentSpawn, e2e chat-bridge.ps1 +
  # fakebrain.exe (nao ACP gia tra "pong:<username>" — verify duoc nao
  # thuc su chay duoi troly-agent).
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: lint .ps1
        run: |
          $bad = 0
          Get-ChildItem tools,deploy -Filter *.ps1 -Recurse | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName, [ref]$null, [ref]$errs) | Out-Null
            foreach ($e in $errs) {
              Write-Host "PARSE $($_.FullName): $($e.Message) @$($e.Extent.StartLineNumber)"
              $bad++
            }
          }
          if ($bad) { exit 1 }
      - name: setup restricted user + ACL
        run: tools/setup-agent-user.ps1
      - name: build fake ACP brain
        # Build ra C:\Windows\Temp — KHÔNG trong tools\ vì deny-W trên
        # tools\ chặn cả EXECUTE của .exe (quirk Windows: deny-write trên
        # PE = không chạy được). Grant RX cho troly-agent.
        run: |
          dotnet new console -o "$env:TEMP\fbproj" -n fakebrain -f net8.0 --force | Out-Null
          Copy-Item tools/test-fakebrain.cs "$env:TEMP\fbproj\Program.cs" -Force
          dotnet build "$env:TEMP\fbproj" -c Release -o C:\Windows\Temp\fakebrain-bin | Out-Null
          icacls C:\Windows\Temp\fakebrain-bin /grant "troly-agent:(OI)(CI)RX" /Q | Out-Null
      - name: sandbox smoke test
        run: tools/test-agent-spawn.ps1

  build:
    needs: [test, test-windows]
    strategy:
      matrix:
        include:
          - { os: macos-latest,    name: troly }
          - { os: windows-latest,  name: TroLyAI.exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # Git Bash có sẵn trên windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: python -m pip install pyinstaller==6.11.1   # pin version — build tool kéo code tuỳ ý
      - run: bash tools/build.sh
      - name: sign + notarize (macOS)
        if: matrix.os == 'macos-latest'
        env:
          MACOS_P12: ${{ secrets.MACOS_P12 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          NOTARY_KEY_B64: ${{ secrets.NOTARY_KEY_B64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          SIGN_IDENTITY: "Developer ID Application: Hieu Phan Trong (KHZWP95P4J)"
        run: |
          set -euo pipefail
          # Keychain tạm — cert import xong thì hỏng cũng không sao,
          # runner xoá cùng job.
          KC=build.keychain
          KCPW="$(openssl rand -hex 16)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$MACOS_P12" | base64 -d > cert.p12
          security import cert.p12 -k "$KC" -P "$MACOS_P12_PASSWORD" \
              -T /usr/bin/codesign
          # set-key-partition-list: bắt buộc trên runner headless để
          # codesign đọc private key không bị prompt GUI
          security set-key-partition-list -S apple-tool:,apple: \
              -k "$KCPW" "$KC"
          security list-keychain -d user -s "$KC" \
              $(security list-keychain -d user | tr -d '"')
          shred -u cert.p12 2>/dev/null || rm -fP cert.p12

          codesign --force --options runtime --timestamp \
              --entitlements tools/entitlements.plist \
              --keychain "$KC" --sign "$SIGN_IDENTITY" dist/troly

          ditto -c -k --keepParent dist/troly troly-notary.zip
          echo "$NOTARY_KEY_B64" | base64 -d > AuthKey.p8
          xcrun notarytool submit troly-notary.zip \
              --key AuthKey.p8 --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER" --wait
          rm -f AuthKey.p8 troly-notary.zip
      - name: rename artifact
        run: mv dist/troly* "dist/${{ matrix.name }}" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      # Tag phải khớp VERSION — portal so VERSION với release mới nhất để
      # hiện banner "có bản mới"; lệch nhau là banner báo sai.
      # create → nếu release đã tồn tại (tag lại) thì upload --clobber.
      - run: |
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME != VERSION $(cat VERSION)"; exit 1; }
          gh release create "$GITHUB_REF_NAME" \
            troly/troly "TroLyAI.exe/TroLyAI.exe" \
            --generate-notes --verify-tag \
          || gh release upload "$GITHUB_REF_NAME" \
            troly/troly "TroLyAI.exe/TroLyAI.exe" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
