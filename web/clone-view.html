<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xem & sửa trang clone</title>
<style>
:root { --accent:#4f46e5; --ink:#222; --mut:#888; --line:#e5e5ea; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column}
#bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);
  background:#fff;z-index:10}
#bar .name{font-weight:600;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:0;border-radius:9px;padding:9px 14px;font-size:13px;cursor:pointer;background:#f1f1f4;color:#333}
.btn:hover{background:#e6e6ea}
.btn.pri{background:var(--accent);color:#fff}.btn.pri:hover{background:#4338ca}
.btn.pri.on{background:#16a34a}
#frame{flex:1;border:0;width:100%}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);
  background:#222;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;
  transition:transform .25s;z-index:99;opacity:.95}
#toast.show{transform:translateX(-50%) translateY(0)}
#hint{font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<div id="bar">
  <span class="name" id="fname">trang</span>
  <span id="hint"></span>
  <button class="btn pri" id="btn-edit">✏️ Sửa nội dung</button>
  <button class="btn" id="btn-theme" title="Đổi màu chủ đạo toàn trang" hidden>🎨 Màu chính</button>
  <button class="btn" id="btn-undo" title="Hoàn tác bước vừa sửa" disabled>↩ Hoàn tác</button>
  <button class="btn" id="btn-revert" title="Về đúng bản gốc lúc mới clone" disabled>🔄 Về bản gốc</button>
  <button class="btn" id="btn-save">💾 Lưu lại trang</button>
  <button class="btn" id="btn-dl">⬇ Tải về máy</button>
  <button class="btn" id="btn-x" title="Đóng">✕</button>
</div>
<iframe id="frame"></iframe>
<div id="toast"></div>

<script>
const qs = new URLSearchParams(location.search);
// chỉ cho phép xem file cùng origin trong my-course/ (chặn mở URL lạ)
let SRC = qs.get('src') || '';
if (!/^\/(my-course|intro)\/[\w.\-\/]+\.html?$/i.test(SRC)) SRC = '';
const BRIDGE = 'http://localhost:7682';
const frame = document.getElementById('frame');
const fname = document.getElementById('fname');
const hint = document.getElementById('hint');
let editing = false, dirty = false;
let undoStack = [];        // [{idx, html}] — snapshot section trước mỗi lần sửa
let origBody = null;       // body.innerHTML lúc mở viewer → nút "Về bản gốc"

function sections() {
  return Array.from(frameDoc().querySelectorAll('section[data-cs]'));
}
// chụp section chứa el TRƯỚC khi sửa — một phần tử chỉ chụp 1 lần mỗi lần sửa
function snapBefore(el) {
  const sec = el.closest && el.closest('section[data-cs]');
  const secs = sections();
  const idx = sec ? secs.indexOf(sec) : -1;
  const key = sec || el;
  if (key._csSnapped) return;
  key._csSnapped = true;
  undoStack.push(idx >= 0 ? { idx, html: sec.outerHTML }
                          : { idx: -1, html: frameDoc().body.innerHTML });
  document.getElementById('btn-undo').disabled = false;
  document.getElementById('btn-revert').disabled = false;
}
function clearSnapFlags() {
  frameDoc().querySelectorAll('section[data-cs]').forEach(s => s._csSnapped = false);
}
function undo() {
  const u = undoStack.pop();
  if (!u) return;
  const d = frameDoc();
  if (u.idx >= 0) {
    const secs = sections();
    if (secs[u.idx]) secs[u.idx].outerHTML = u.html;
  } else {
    d.body.innerHTML = u.html;
  }
  clearSnapFlags(); killPop(); editingEl = null; dirty = true;
  if (!undoStack.length) document.getElementById('btn-undo').disabled = true;
}
function revertAll() {
  if (!origBody || !confirm('Đưa trang về đúng bản gốc lúc mới clone?')) return;
  frameDoc().body.innerHTML = origBody;
  undoStack = []; clearSnapFlags(); killPop(); editingEl = null; dirty = true;
  document.getElementById('btn-undo').disabled = true;
  document.getElementById('btn-revert').disabled = true;
  if (editing) {
    frameDoc().querySelectorAll('section[data-cs]').forEach(s => outline(s, true));
  }
}

fname.textContent = SRC ? SRC.split('/').pop() : '(thiếu ?src=)';
if (SRC) {
  frame.src = SRC;
  frame.onload = () => { origBody = frameDoc() ? frameDoc().body.innerHTML : null; };
} else hint.textContent = 'Mở kèm ?src=/my-course/ten-file.html';

function toast(t) {
  const el = document.getElementById('toast');
  el.textContent = t; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2500);
}

// ─── Chế độ sửa: tiêm hành vi vào tài liệu trong iframe (same-origin) ───
const LEAF_MARK = '[data-cs-text],[data-cs-img],[data-cs-link]';
let doc = null, hoverEl = null, popEl = null, editingEl = null;

const POP_CSS = 'position:fixed;z-index:2147483000;background:#fff;border:1px solid #ddd;' +
  'border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:12px;width:280px;' +
  'font-family:-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px';
const POP_INPUT = 'width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:8px;' +
  'padding:7px;font-size:13px;margin:4px 0 10px';

function frameDoc() { return frame.contentDocument; }

function outline(el, on, strong) {
  if (!el) return;
  el.style.outline = on ? (strong ? '3px solid #4f46e5' : '2px dashed rgba(79,70,229,.6)') : '';
  el.style.outlineOffset = '-2px';
}

// đoán phần tử LÁ (chữ/ảnh/link) — chạy trước khi xét khối nền
function guessLeaf(t) {
  if (!t || !t.closest) return null;
  if (t.tagName === 'IMG' || t.closest('img')) return ['img', t.closest('img') || t];
  const a = t.closest('a');
  if (a) return ['link', a];
  const btn = t.closest('button,input[type="button"],input[type="submit"]');
  if (btn) return ['link', btn];
  const INLINE = 'B,I,EM,STRONG,SPAN,U,S,SMALL,SUB,SUP,BR,MARK,CODE';
  const onlyInline = !Array.from(t.children || [])
    .some(c => !INLINE.split(',').includes(c.tagName));
  if (onlyInline && t.innerText.trim()) return ['text', t];
  return null;
}

// nhãn tên khối/loại khi rê chuột — biết mình đang trỏ vào phần nào
let chipEl = null;
const TYPE_VI = { nav:'Menu', hero:'Khối đầu', features:'Ưu điểm',
  content:'Nội dung', gallery:'Thư viện ảnh', pricing:'Bảng giá',
  faq:'Hỏi đáp', testimonial:'Đánh giá', cta:'Kêu gọi', form:'Form',
  blog:'Bài viết', post:'Bài', footer:'Chân trang', misc:'Khối',
  slider:'Trình chiếu', team:'Đội ngũ', steps:'Các bước',
  stats:'Con số', map:'Bản đồ', countdown:'Đếm ngược',
  partners:'Đối tác', timeline:'Mốc thời gian', tabs:'Tab',
  video:'Video', newsletter:'Đăng ký nhận tin', comparison:'So sánh',
  contact:'Liên hệ', banner:'Banner', search:'Tìm kiếm',
  breadcrumb:'Đường dẫn', sidebar:'Thanh bên', comments:'Bình luận' };
function chipFor(el) {
  if (!chipEl) {
    chipEl = doc.createElement('div');
    chipEl.id = 'ce-chip';
    chipEl.style.cssText = 'position:fixed;z-index:2147482999;background:#4f46e5;' +
      'color:#fff;font:600 11px -apple-system,sans-serif;padding:3px 9px;' +
      'border-radius:6px 6px 0 0;pointer-events:none';
    doc.body.appendChild(chipEl);
  }
  const sec = el.closest('section[data-cs]') || (el.matches('section') ? el : null);
  const name = (sec && (sec.getAttribute('data-cs') ||
               TYPE_VI[sec.getAttribute('data-cs-type')])) || el.tagName.toLowerCase();
  chipEl.textContent = name;
  const r = el.getBoundingClientRect();
  chipEl.style.left = Math.max(4, r.left + 3) + 'px';
  chipEl.style.top = Math.max(4, r.top - 20) + 'px';
  chipEl.style.display = 'block';
}
function killChip() { if (chipEl) { chipEl.remove(); chipEl = null; } }

function killPop() { if (popEl) { popEl.remove(); popEl = null; } }

function showPop(anchor, html) {
  killPop();
  popEl = doc.createElement('div');
  popEl.id = 'ce-pop';
  popEl.style.cssText = POP_CSS;
  popEl.innerHTML = html;
  doc.body.appendChild(popEl);
  const r = anchor.getBoundingClientRect();
  let x = Math.min(r.left, frame.clientWidth - 300);
  let y = r.bottom + 8;
  if (y + popEl.offsetHeight > frame.clientHeight - 12)
    y = Math.max(12, r.top - popEl.offsetHeight - 8);
  popEl.style.left = Math.max(8, x) + 'px';
  popEl.style.top = Math.max(8, y) + 'px';
  // click trong popover không bị chặn bởi handler sửa
  popEl.addEventListener('click', e => e.stopPropagation());
  return popEl;
}

function lab(t) { return `<div style="color:#888;font-size:11px">${t}</div>`; }

function editText(el) {
  if (editingEl === el) return;
  snapBefore(el);
  editingEl = el;
  el.contentEditable = 'true';
  el.focus();
  // chọn hết chữ để gõ thay nhanh
  const r = doc.createRange(); r.selectNodeContents(el);
  const s = doc.getSelection(); s.removeAllRanges(); s.addRange(r);
  el.addEventListener('blur', () => {
    el.contentEditable = 'false'; editingEl = null; dirty = true;
  }, { once: true });
}

function popImg(el) {
  snapBefore(el);
  const p = showPop(el,
    '<b>Đổi ảnh</b>' + lab('Link ảnh mới') +
    `<input style="${POP_INPUT}" id="p-src" value="${el.getAttribute('src') || ''}">` +
    lab('…hoặc chọn ảnh từ máy') +
    `<input type="file" accept="image/*" id="p-file" style="font-size:12px;margin:4px 0 10px">` +
    lab('Chú thích ảnh (alt)') +
    `<input style="${POP_INPUT}" id="p-alt" value="${el.getAttribute('alt') || ''}">` +
    `<button style="border:0;background:#f1f1f4;border-radius:8px;padding:7px 12px;cursor:pointer" id="p-ok">Xong</button>`);
  p.querySelector('#p-src').oninput = e => { el.src = e.target.value; dirty = true; };
  p.querySelector('#p-alt').oninput = e => { el.alt = e.target.value; dirty = true; };
  p.querySelector('#p-file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { el.src = rd.result; dirty = true; };
    rd.readAsDataURL(f);
  };
  p.querySelector('#p-ok').onclick = killPop;
}

function popLink(el) {
  snapBefore(el);
  const p = showPop(el,
    '<b>Sửa nút / liên kết</b>' + lab('Chữ hiển thị') +
    `<input style="${POP_INPUT}" id="p-txt" value="${el.innerText}">` +
    lab('Đường dẫn khi bấm') +
    `<input style="${POP_INPUT}" id="p-href" value="${el.getAttribute('href') || ''}">` +
    `<button style="border:0;background:#f1f1f4;border-radius:8px;padding:7px 12px;cursor:pointer" id="p-ok">Xong</button>`);
  p.querySelector('#p-txt').oninput = e => { el.innerText = e.target.value; dirty = true; };
  p.querySelector('#p-href').oninput = e => { el.setAttribute('href', e.target.value); dirty = true; };
  p.querySelector('#p-ok').onclick = killPop;
}

function popBg(el) {
  snapBefore(el);
  const cur = getComputedStyle(el).backgroundColor;
  const p = showPop(el,
    '<b>Nền khối này</b>' + lab('Màu nền') +
    `<input type="color" id="p-c" value="#ffffff" style="width:100%;height:34px;border:1px solid #ddd;border-radius:8px;padding:2px;cursor:pointer">` +
    lab('…hoặc link ảnh nền') +
    `<input style="${POP_INPUT}" id="p-img" placeholder="https://…">` +
    `<button style="border:0;background:#f1f1f4;border-radius:8px;padding:7px 12px;cursor:pointer" id="p-ok">Xong</button>`);
  const m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(cur);
  if (m) p.querySelector('#p-c').value = '#' + [1,2,3]
    .map(i => ('0' + (+m[i]).toString(16)).slice(-2)).join('');
  p.querySelector('#p-c').oninput = e => { el.style.background = e.target.value; dirty = true; };
  p.querySelector('#p-img').oninput = e => {
    el.style.backgroundImage = e.target.value ? `url("${e.target.value}")` : '';
    el.style.backgroundSize = 'cover'; dirty = true;
  };
  p.querySelector('#p-ok').onclick = killPop;
}

// Thứ tự chọn: marker lá → đoán lá → nền/khối.
// Không để section[data-cs] nuốt click của phần tử con bên trong.
function pickFrom(t, mark) {
  if (!t || !t.closest) return { el: null, kind: null };
  const leaf = t.closest(LEAF_MARK);
  if (leaf) return { el: leaf, kind: null };
  const g = guessLeaf(t);
  if (g) {
    if (mark) g[1].setAttribute('data-cs-' + g[0], '');
    return { el: g[1], kind: g[0] };
  }
  const box = t.closest('[data-cs-bg]') || t.closest('section[data-cs]') ||
              t.closest('section,div[class]');
  if (box) {
    if (mark && !box.hasAttribute('data-cs-bg')) box.setAttribute('data-cs-bg', '');
    return { el: box, kind: 'bg' };
  }
  return { el: null, kind: null };
}
function onOver(e) {
  if (editingEl) return;
  const el = pickFrom(e.target, false).el;
  if (el !== hoverEl) {
    outline(hoverEl, false); hoverEl = el; outline(el, true);
    if (el) chipFor(el); else killChip();
  }
}
function onOut(e) {
  const el = pickFrom(e.target, false).el;
  if (el && el !== editingEl) outline(el, false);
  if (hoverEl === el) { hoverEl = null; killChip(); }
}
function onClick(e) {
  if (editingEl) return;   // đang gõ chữ trong phần tử
  const { el, kind } = pickFrom(e.target, true);
  e.preventDefault(); e.stopPropagation();
  if (!el) { killPop(); return; }
  if (kind === 'img' || el.hasAttribute('data-cs-img')) popImg(el);
  else if (kind === 'link' || el.hasAttribute('data-cs-link')) popLink(el);
  else if (kind === 'text' || el.hasAttribute('data-cs-text')) editText(el);
  else if (kind === 'bg' || el.hasAttribute('data-cs-bg')) popBg(el);
}

function setEdit(on) {
  doc = frameDoc();
  if (!doc) return;
  const b = document.getElementById('btn-edit');
  editing = on;
  b.textContent = on ? '✔ Xong — hết sửa' : '✏️ Sửa nội dung';
  b.classList.toggle('on', on);
  hint.textContent = on ? 'Đang ở chế độ sửa — bấm vào chữ/ảnh/nút/khối trên trang để chỉnh' : '';
  if (on) {
    doc.addEventListener('mouseover', onOver, true);
    doc.addEventListener('mouseout', onOut, true);
    doc.addEventListener('click', onClick, true);
    doc.querySelectorAll('section[data-cs]').forEach(s => outline(s, true));
  } else {
    doc.removeEventListener('mouseover', onOver, true);
    doc.removeEventListener('mouseout', onOut, true);
    doc.removeEventListener('click', onClick, true);
    doc.querySelectorAll('section[data-cs],[data-cs-text],[data-cs-img],[data-cs-link],[data-cs-bg]')
      .forEach(s => outline(s, false));
    killPop(); killChip(); hoverEl = null;
  }
}

function serialize() {
  const c = frameDoc().documentElement.cloneNode(true);
  c.querySelectorAll('section[data-cs],[data-cs-text],[data-cs-img],[data-cs-link],[data-cs-bg]')
    .forEach(s => { s.style.outline = ''; s.style.outlineOffset = ''; });
  c.querySelectorAll('[contenteditable]').forEach(s => s.removeAttribute('contenteditable'));
  // bỏ UI của editor (popover, nhãn khối) — giữ lại _csSty (màu chủ đạo đã đổi)
  c.querySelectorAll('#ce-pop,#ce-chip').forEach(s => s.remove());
  return '<!DOCTYPE html>\n' + c.outerHTML;
}

document.getElementById('btn-edit').onclick = () => setEdit(!editing);
document.getElementById('btn-undo').onclick = undo;
document.getElementById('btn-revert').onclick = revertAll;

// nút 🎨 Màu chính — chỉ hiện khi trang clone khai báo --cs-primary
frame.addEventListener('load', () => {
  const v = frameDoc() && getComputedStyle(frameDoc().documentElement)
    .getPropertyValue('--cs-primary').trim();
  document.getElementById('btn-theme').hidden = !v;
});
document.getElementById('btn-theme').onclick = () => {
  if (!editing) setEdit(true);
  const root = frameDoc().documentElement;
  const cur = getComputedStyle(root).getPropertyValue('--cs-primary').trim();
  const p = showPop(frameDoc().body,
    '<b>Màu chủ đạo toàn trang</b>' + lab('Màu chính (--cs-primary)') +
    `<input type="color" id="p-c" value="#4f46e5" style="width:100%;height:34px;border:1px solid #ddd;border-radius:8px;padding:2px;cursor:pointer">` +
    `<button style="border:0;background:#f1f1f4;border-radius:8px;padding:7px 12px;cursor:pointer" id="p-ok">Xong</button>`);
  p.style.top = '56px'; p.style.left = 'auto'; p.style.right = '12px';
  const m = /#([0-9a-f]{6})/i.exec(cur); if (m) p.querySelector('#p-c').value = m[0];
  p.querySelector('#p-c').oninput = e => {
    if (!frameDoc()._csSty) {
      frameDoc()._csSty = frameDoc().createElement('style');
      frameDoc().head.appendChild(frameDoc()._csSty);
    }
    frameDoc()._csSty.textContent = `:root{--cs-primary:${e.target.value}}`;
    dirty = true;
  };
  p.querySelector('#p-ok').onclick = killPop;
};

document.getElementById('btn-save').onclick = async () => {
  try {
    const r = await fetch(BRIDGE + '/api/save-page', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file: SRC, html: serialize() }) });
    const d = await r.json();
    if (d.ok) { dirty = false; toast('Đã lưu lại trang ✓'); }
    else toast(d.err || 'Không lưu được');
  } catch (e) { toast('Không nói được với trợ lý — dùng nút Tải về thay thế'); }
};

document.getElementById('btn-dl').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([serialize()], { type: 'text/html' }));
  a.download = (SRC.split('/').pop() || 'trang.html').replace(/\.html?$/i, '') + '-da-chinh.html';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};

document.getElementById('btn-x').onclick = () => {
  if (dirty && !confirm('Có thay đổi chưa lưu — thoát luôn?')) return;
  if (history.length > 1) history.back(); else window.close();
};
</script>
</body>
</html>
