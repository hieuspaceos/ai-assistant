<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trợ lý AI — thiết lập lần đầu</title>
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<style>
:root { --accent:#0f9d58; --accent-d:#0b7a44; --bg:#f6f8f7; --card:#fff; --ink:#1d2129; --mut:#6b7280; --line:#e3e8e5; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Instrument Sans',system-ui,sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:36px 40px; width:min(560px,100%); box-shadow:0 8px 40px rgba(15,157,88,.07); }
.brand { display:flex; align-items:center; gap:12px; margin-bottom:26px; }
.brand-name { font-weight:700; font-size:18px; }
.brand-sub { color:var(--mut); font-size:13px; }
.steps { display:flex; gap:6px; margin-bottom:26px; }
.step-dot { flex:1; height:4px; border-radius:2px; background:var(--line); }
.step-dot.on { background:var(--accent); }
h1 { font-size:24px; margin-bottom:8px; }
.lead { color:var(--mut); margin-bottom:24px; line-height:1.55; }
.opts { display:grid; gap:10px; margin-bottom:26px; }
.opts.cols { grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); }
.opt { display:flex; align-items:center; gap:12px; padding:14px 16px; border:2px solid var(--line); border-radius:12px; cursor:pointer; font-size:15px; transition:.15s; background:#fff; }
.opt:hover { border-color:var(--accent); }
.opt.sel { border-color:var(--accent); background:#f0faf4; }
.opt .flag { font-size:22px; }
.opt small { display:block; color:var(--mut); font-weight:400; margin-top:2px; }
input[type=text] { width:100%; padding:14px 16px; font-size:16px; border:2px solid var(--line); border-radius:12px; font-family:inherit; margin-bottom:26px; }
input[type=text]:focus { outline:none; border-color:var(--accent); }
.row { display:flex; gap:10px; justify-content:space-between; }
button.btn { padding:12px 26px; border:none; border-radius:12px; font-size:15px; font-weight:600; font-family:inherit; cursor:pointer; }
.btn.pri { background:var(--accent); color:#fff; }
.btn.pri:hover { background:var(--accent-d); }
.btn.pri:disabled { background:#b9c9c0; cursor:default; }
.btn.ghost { background:transparent; color:var(--mut); }
.mini-btn { padding:5px 12px; border:1.5px solid var(--accent); border-radius:8px; background:transparent; color:var(--accent); font-size:12.5px; font-weight:600; font-family:inherit; cursor:pointer; }
.mini-btn:hover { background:rgba(20,122,79,.07); }
.check { padding:10px 14px; border:2px solid var(--line); border-radius:10px; cursor:pointer; display:flex; gap:8px; align-items:center; font-size:14px; }
.check.sel { border-color:var(--accent); background:#f0faf4; }
.check input { accent-color:var(--accent); }
.custom-row { display:flex; gap:8px; margin-top:10px; }
.custom-row input { flex:1; margin-bottom:0; padding:10px 14px; font-size:14px; }
.note { font-size:13px; color:var(--mut); margin-top:14px; line-height:1.5; }
.done-check { font-size:44px; text-align:center; margin-bottom:10px; }
.err { color:#c0392b; font-size:13px; margin-top:10px; }
.badge { font-size:11px; padding:2px 8px; border-radius:9px; background:#e8f5ee; color:var(--accent-d); font-weight:600; margin-left:6px; vertical-align:1px; }
.badge.off { background:#f0f1f3; color:var(--mut); }
.opt.dis { opacity:.55; cursor:default; }
.opt.dis:hover { border-color:var(--line); }
.bot-card { align-items:flex-start; }
.bot-card .flag { font-size:26px; margin-top:2px; }
.need-row { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.need-row .note { margin-top:0; }
.need { font-size:11.5px; padding:2px 9px; border-radius:9px; font-weight:600; }
.need.ok { background:#e8f5e9; color:#2e7d32; }
.need.warn { background:#f0f1f3; color:#9a6a00; }
.bot-pick { margin-top:10px; display:flex; gap:8px; align-items:center; }
.bot-pick .note { margin-top:0; flex-shrink:0; }
.bot-pick input { flex:1; margin-bottom:0; padding:9px 12px; font-size:14px; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <svg viewBox="0 0 38 38" width="38" height="38" aria-hidden="true">
      <rect width="38" height="38" rx="11" fill="#0f9d58"/>
      <path d="M19 9.5 31.5 15.5 19 21.5 6.5 15.5Z" fill="#fff"/>
      <path d="M14.5 19.1v5.2c0 1.8 2 2.9 4.5 2.9s4.5-1.1 4.5-2.9v-5.2l-4.5 2.1z" fill="#fff"/>
      <path d="M30.7 15.5v5.4" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="30.7" cy="23.4" r="1.7" fill="#fff"/>
    </svg>
    <div><div class="brand-name">Trợ lý AI</div><div class="brand-sub" id="brand-sub"></div></div>
  </div>
  <div class="steps" id="dots"></div>
  <div id="step"></div>
</div>
<script src="bridge-token.js"></script>
<script>
const BRIDGE = 'http://localhost:7682';
// ID cố định của extension nhờ "key" trong manifest — auto-pair: gửi mã
// kết nối thẳng cho extension, khỏi bắt học viên dán tay (còn ô dán dự
// phòng trong trang options của extension).
const EXT_ID = 'mdalidmkajiinlpdefjchbgcejjjmpeh';
function tryPairExt() {
  try {
    if (!window.chrome || !chrome.runtime || !chrome.runtime.sendMessage) return;
    chrome.runtime.sendMessage(EXT_ID,
      { t: 'set-token', token: window.BRIDGE_TOKEN }, () => void chrome.runtime.lastError);
  } catch (e) { /* chưa cài extension — cờ "!" trên icon nhắc dán mã sau */ }
}
let lang = 'vi', learnerName = '', folders = [], stepIdx = 0;

const T = {
  vi: {
    sub:'thiết lập lần đầu', welcome:'Chào bạn! Chọn ngôn ngữ trước nhé',
    welcomeLead:'Trợ lý sẽ nói chuyện và dạy bạn bằng ngôn ngữ này.',
    name:'Bạn tên gì?', nameLead:'Để trợ lý gọi bạn cho đúng — có thể là tên, biệt danh, gì cũng được.',
    namePh:'Ví dụ: Hiếu', nameSkip:'Bỏ qua',
    folder:'Trợ lý được đọc folder nào?', folderLead:'Trợ lý chỉ đụng vào những folder bạn cho phép ở đây — phần còn lại nó không thấy. Chọn folder hay để file làm việc.',
    folderHint:'Mặc định là <b>chỉ đọc</b> (trợ lý xem được, không sửa xoá). Sau này chỉnh thêm trong portal.',
    folderCustom:'Thêm folder khác…',
    apps:'Muốn trợ lý dùng app nào?', appsLead:'Chọn các ứng dụng bạn hay dùng — trợ lý sẽ hướng dẫn kết nối từng cái sau. Không chọn cũng không sao.',
    next:'Tiếp →', back:'← Quay lại', start:'Bắt đầu dùng →',
    done:'Xong hết!', doneLead:'Trợ lý đã sẵn sàng. Mình sẽ đưa bạn tới portal — chỗ hỏi trợ lý và bắt đầu khoá học.',
    pendingNote:'Vài thay đổi đang chờ bạn duyệt — vào portal, bấm "Đồng ý" trong thẻ chat là xong nhé.',
    appNote:'Riêng <b>Trình duyệt</b>: cần cài thêm một gói nhỏ vào Chrome/Edge — trợ lý sẽ hướng dẫn khi bạn cần dùng tới.',
    errFolder:'Không thấy folder này trên máy — kiểm tra lại đường dẫn nhé',
    errEmpty:'Gõ đường dẫn folder trước đã (ví dụ ~/Documents hoặc D:\\work)',
    errBridge:'Không gọi được trợ lý — kiểm tra bridge :7682 đang chạy chưa',
    saving:'Đang lưu…',
    brain:'Chọn "bộ não" cho trợ lý',
    brainLead:'Trợ lý nói chuyện và làm việc nhờ một chương trình AI cài sẵn trên máy — gọi là "não". Não nào có nhãn "đã cài" là dùng được ngay. Không chắc thì cứ giữ mặc định nhé.',
    brainLoading:'Đang tìm não trên máy…',
    brainIn:'đã cài', brainOut:'chưa cài',
    brainInstall:'Cài não này', brainRecheck:'Tôi đã cài xong — kiểm tra lại',
    brainInstalledNow:'Đã thấy não mới — chọn nó để dùng luôn!',
    brainNow:'Não đang dùng',
    brainCustom:'Não khác (nâng cao)',
    brainCustomSub:'tự nhập lệnh chạy não chế độ ACP',
    brainCustomNote:'Gõ lệnh đầy đủ để mở não ở chế độ ACP — ví dụ <code>goose acp</code>, <code>kimi acp</code>.',
    brainCustomPh:'ví dụ: goose acp',
    brainEmpty:'Gõ lệnh chạy não trước đã',
    brainErr:'Chưa đổi được não — thử lại hoặc để mặc định',
    brainCostFree:'miễn phí', brainCostByok:'app miễn phí', brainCostPaid:'trả phí',
    brainRec:'gợi ý',
    brainNeedInstall:'Não này chưa cài — bấm "Cài não này" bên dưới nó, xong bấm kiểm tra lại',
    botPick:'Chọn trợ lý của bạn',
    botPickLead:'Mỗi trợ lý giống một nhân viên đã biết sẵn một nhóm việc. Chọn người hợp công việc của bạn nhất — đổi sau được.',
    botNeeds:'Cần nối:',
    botConnOk:'đã nối', botConnWarn:'chưa nối — nối sau cũng được',
    botNameLbl:'Đặt tên cho trợ lý',
    botUse:'Chọn trợ lý này',
    botSkip:'Bỏ qua — dùng trợ lý chung',
    botCreating:'Đang tạo trợ lý…',
    botErr:'Chưa tạo được trợ lý — bỏ qua bước này cũng được',
  },
  en: {
    sub:'first-time setup', welcome:'Hi there! Pick a language first',
    welcomeLead:'The assistant will talk and teach you in this language.',
    name:'What\'s your name?', nameLead:'So the assistant greets you properly — a name or nickname, anything works.',
    namePh:'e.g. Alex', nameSkip:'Skip',
    folder:'Which folders can the assistant read?', folderLead:'The assistant only touches folders you allow here — everything else stays invisible to it. Pick where your work files live.',
    folderHint:'Default is <b>read-only</b> (the assistant can look, not change). You can adjust later in the portal.',
    folderCustom:'Add another folder…',
    apps:'Which apps should the assistant use?', appsLead:'Pick the apps you use — the assistant will guide you through connecting each one later. Skipping is fine too.',
    next:'Next →', back:'← Back', start:'Start using it →',
    done:'All set!', doneLead:'Your assistant is ready. Taking you to the portal — where you can ask it things and start your course.',
    pendingNote:'A few changes need your approval — press "Đồng ý" on the chat card in the portal to finish.',
    appNote:'For the <b>Browser</b>: it needs one small add-on in Chrome/Edge — the assistant will guide you when you first need it.',
    errFolder:'That folder isn\'t on this machine — check the path',
    errEmpty:'Type a folder path first (e.g. ~/Documents or D:\\work)',
    errBridge:'Can\'t reach the assistant — check the bridge :7682 is running',
    saving:'Saving…',
    brain:'Pick the assistant\'s "brain"',
    brainLead:'The assistant talks and works through an AI program installed on this machine — its "brain". Anything tagged "installed" works right away. Not sure? Keep the default.',
    brainLoading:'Looking for brains on this machine…',
    brainIn:'installed', brainOut:'not installed',
    brainInstall:'Install this brain', brainRecheck:'Done installing — check again',
    brainInstalledNow:'New brain detected — pick it to use it!',
    brainNow:'Current brain',
    brainCustom:'Another brain (advanced)',
    brainCustomSub:'type the command that runs the brain in ACP mode',
    brainCustomNote:'Type the full command that starts the brain in ACP mode — e.g. <code>goose acp</code>, <code>kimi acp</code>.',
    brainCustomPh:'e.g. goose acp',
    brainEmpty:'Type the brain command first',
    brainErr:'Couldn\'t switch brains — retry or keep the default',
    brainCostFree:'free', brainCostByok:'free app', brainCostPaid:'paid',
    brainRec:'suggested',
    brainNeedInstall:'This brain isn\'t installed — use "Install this brain" below it, then check again',
    botPick:'Pick your assistant',
    botPickLead:'Each assistant is like a coworker who already knows one set of tasks. Pick whoever fits your work — you can switch later.',
    botNeeds:'Needs:',
    botConnOk:'connected', botConnWarn:'not connected — you can connect later',
    botNameLbl:'Name your assistant',
    botUse:'Pick this assistant',
    botSkip:'Skip — use the general assistant',
    botCreating:'Creating your assistant…',
    botErr:'Couldn\'t create the assistant — skipping this step is fine too',
  },
};

const FOLDER_PRESETS = [
  { path:'~/Downloads', vi:'Downloads', en:'Downloads' },
  { path:'~/Desktop',   vi:'Desktop',   en:'Desktop' },
  { path:'~/Documents', vi:'Documents', en:'Documents' },
];
const APP_PRESETS = [
  { id:'zalo',          type:'browser', vi:'Zalo Web',        en:'Zalo Web' },
  { id:'outlook',       type:'browser', vi:'Outlook Web',     en:'Outlook Web' },
  { id:'wordpress',     type:'rest',    vi:'WordPress',        en:'WordPress' },
  { id:'google-sheets', type:'browser', vi:'Google Sheets',    en:'Google Sheets' },
  { id:'canva',         type:'browser', vi:'Canva',            en:'Canva' },
  { id:'zalo-oa',       type:'rest',    vi:'Zalo OA',          en:'Zalo OA' },
  { id:'trinh-duyet',   type:'browser', vi:'Trình duyệt (extension)', en:'Browser (extension)' },
];
let selFolders = new Set(['~/Downloads']);
let needConfirm = false;   // bước finish có request nào trả pending → báo ở màn cuối
let selApps = new Set();
let brainData = null, selBrain = '', customBrain = '';

function t(k){ return T[lang][k]; }
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function esc(s){ const d=document.createElement('div'); d.textContent=String(s==null?'':s); return d.innerHTML; }
function dots(){ const d=document.getElementById('dots'); d.innerHTML=''; for(let i=0;i<7;i++) d.appendChild(el(`<div class="step-dot${i<=stepIdx?' on':''}"></div>`)); }
function go(i){ stepIdx=i; dots(); [stepLang,stepName,stepBot,stepBrain,stepFolder,stepApps,stepDone][i](); }

function stepLang(){
  const s=document.getElementById('step');
  s.innerHTML=`<h1>${T.vi.welcome}<br><span style="font-size:19px;color:var(--mut);font-weight:500">${T.en.welcome}</span></h1>
    <p class="lead">${T.vi.welcomeLead}<br>${T.en.welcomeLead}</p><div class="opts" id="opts"></div>`;
  document.getElementById('brand-sub').textContent=t('sub');
  const opts=s.querySelector('#opts');
  [['vi','🇻🇳','Tiếng Việt','Trợ lý nói tiếng Việt'],['en','🇬🇧','English','Assistant speaks English']].forEach(([v,f,n,sub])=>{
    const o=el(`<div class="opt${lang===v?' sel':''}"><span class="flag">${f}</span><div><b>${n}</b><small>${sub}</small></div></div>`);
    o.onclick=()=>{ lang=v; go(0); };
    opts.appendChild(o);
  });
  s.appendChild(el(`<div class="row"><span></span><button class="btn pri">${t('next')}</button></div>`))
    .querySelector('button').onclick=()=>go(1);
}

function stepName(){
  const s=document.getElementById('step');
  s.innerHTML=`<h1>${t('name')}</h1><p class="lead">${t('nameLead')}</p>
    <input type="text" id="nm" placeholder="${t('namePh')}">
    <div class="row"><button class="btn ghost">${t('back')}</button><button class="btn pri">${t('next')}</button></div>`;
  const inp=s.querySelector('#nm'); inp.value=learnerName; inp.focus();
  s.querySelector('.ghost').onclick=()=>{ learnerName=inp.value.trim(); go(0); };
  const next=()=>{ learnerName=inp.value.trim(); go(2); };
  s.querySelector('.pri').onclick=next;
  inp.onkeydown=e=>{ if(e.key==='Enter') next(); };
}

// Gallery trợ lý theo nghề: thẻ = nhân viên đã biết một nhóm việc.
// KHÔNG chặn vì connection thiếu — badge ⚠ chỉ để báo trước.
let selTpl = null, botName = '';
function stepBot(){
  const s=document.getElementById('step');
  s.innerHTML=`<h1>${t('botPick')}</h1><p class="lead">${t('botPickLead')}</p>
    <div class="opts" id="bots"><p class="note">${t('brainLoading')}</p></div>
    <p class="err" id="botErr"></p>
    <div class="row" style="margin-top:22px"><button class="btn ghost">${t('back')}</button>
      <button class="btn" id="skip">${t('botSkip')}</button>
      <button class="btn pri" id="bnext">${t('next')}</button></div>`;
  const box=s.querySelector('#bots');
  Promise.all([
    bfetch(BRIDGE+'/api/bots').then(r=>r.json()),
    bfetch(BRIDGE+'/api/connections').then(r=>r.json()).catch(()=>({apps:[]}))
  ]).then(([b,k])=>{
    const conn={}; (k.apps||[]).forEach(a=>conn[a.id]=a);
    box.innerHTML='';
    (b.templates||[]).forEach(tp=>{
      const needs=(tp.needs||[]).map(n=>{
        const a=conn[n]; const ok=a&&a.status==='connected';
        const nm=(a&&a.name)||n;
        return `<span class="need ${ok?'ok':'warn'}" title="${ok?t('botConnOk'):t('botConnWarn')}">${esc(nm)} ${ok?'✓':'⚠'}</span>`;
      }).join(' ');
      const nm=(tp.suggested_bot_name&&tp.suggested_bot_name[lang])||tp.suggested_bot_name?.vi||'';
      const card=el(`<div class="opt bot-card${selTpl===tp?' sel':''}">
        <span class="flag">${esc(tp.avatar||'🤖')}</span>
        <div><b>${esc((tp.name&&tp.name[lang])||tp.id)}</b>
          <small>${esc((tp.desc&&tp.desc[lang])||'')}</small>
          <div class="need-row"><span class="note">${t('botNeeds')}</span> ${needs}</div>
          <div class="bot-pick" style="display:none">
            <label class="note">${t('botNameLbl')}</label>
            <input type="text" class="bot-name" value="${esc(nm)}">
          </div>
        </div></div>`);
      const pick=card.querySelector('.bot-pick');
      const open=()=>{ selTpl=tp;
        box.querySelectorAll('.bot-card').forEach(c=>{c.classList.remove('sel'); c.querySelector('.bot-pick').style.display='none';});
        card.classList.add('sel'); pick.style.display='';
        const inp=pick.querySelector('.bot-name'); inp.focus();
        inp.oninput=e=>{ botName=e.target.value; };
        botName=inp.value; };
      card.onclick=open;
      card._tpl=tp;
      box.appendChild(card);
    });
    // gợi ý sẵn "office" cho ai không biết chọn — chỉ mở sẵn, không tự tạo
    const off=[...box.querySelectorAll('.bot-card')].find(c=>c._tpl.id==='office');
    if(!selTpl&&off) off.click();
  }).catch(()=>{ box.innerHTML=`<p class="note">${t('errBridge')}</p>`; });
  s.querySelector('.ghost').onclick=()=>go(1);
  // "Bỏ qua" xoá lựa chọn rồi đi tiếp; "Tiếp" giữ lựa chọn (nếu có)
  s.querySelector('#skip').onclick=()=>{ selTpl=null; go(3); };
  s.querySelector('#bnext').onclick=()=>go(3);
}

function stepBrain(){
  const s=document.getElementById('step');
  s.innerHTML=`<h1>${t('brain')}</h1><p class="lead">${t('brainLead')}</p>
    <div class="opts" id="bl"><p class="note">${t('brainLoading')}</p></div>
    <div class="custom-row" id="bcwrap" style="display:none;margin-top:14px"><input type="text" id="bc" placeholder="${t('brainCustomPh')}"></div>
    <p class="note" id="bcnote" style="display:none">${t('brainCustomNote')}</p>
    <p class="err" id="be"></p>
    <div class="row" style="margin-top:22px"><button class="btn ghost">${t('back')}</button><button class="btn pri" id="bn">${t('next')}</button></div>`;
  const bl=s.querySelector('#bl');
  const show=d=>{
    brainData=d;
    if(!selBrain) selBrain=(d.current&&d.current.id)||'devin';
    bl.innerHTML='';
    // não hiện tại không nằm trong preset (custom) → vẫn cho thấy đang dùng
    // cái gì + đổ sẵn lệnh vào ô custom (não cũ id='custom' thì selBrain
    // đã là 'custom' từ dòng trên)
    const cur=d.current||{};
    // sort: đã cài lên đầu → miễn phí → byok → trả phí; trong nhóm giữ thứ
    // tự preset. Không não nào installed → preselect gemini (free tier) để
    // card nó sáng lên kèm hint cài — next bị chặn bởi guard phía dưới
    const rank={free:0,byok:1,paid:2};
    const sorted=(d.presets||[]).slice().sort((a,b)=>
      (b.installed-a.installed)||((rank[a.cost]??2)-(rank[b.cost]??2)));
    if(!sorted.some(p=>p.installed)&&sorted.some(p=>p.id==='gemini'&&p.cost==='free'))
      selBrain='gemini';
    if(cur.cmd && !(d.presets||[]).some(p=>p.id===cur.id)){
      if(selBrain==='custom' && !customBrain)
        customBrain=(cur.cmd+' '+(cur.args||[]).join(' ')).trim();
      bl.appendChild(el(`<p class="note" style="margin:0 0 6px">${t('brainNow')}: <code>${cur.cmd} ${(cur.args||[]).join(' ')}</code></p>`));
    }
    sorted.forEach(p=>{
      const costBadge=p.cost==='free'?` <span class="badge" style="background:#e8f5e9;color:#2e7d32">${t('brainCostFree')}</span>`
        :p.cost==='byok'?` <span class="badge off">${t('brainCostByok')}</span>`
        :` <span class="badge off">${t('brainCostPaid')}</span>`;
      const recBadge=(selBrain===p.id&&!p.installed)?` <span class="badge" style="background:#fff3e0;color:#e65100">${t('brainRec')}</span>`:'';
      const o=el(`<div class="opt${p.installed?'':' dis'}${selBrain===p.id?' sel':''}">
        <span class="flag">${p.installed?'🧠':'⚪'}</span>
        <div><b>${p.label}</b><span class="badge${p.installed?'':' off'}">${p.installed?t('brainIn'):t('brainOut')}</span>${costBadge}${recBadge}<small>${(p.desc&&p.desc[lang])||''}</small></div></div>`);
      o.onclick=()=>{ if(!p.installed) return; selBrain=p.id; show(d); };
      // chưa cài + có trang hướng dẫn → nút "Cài não này" mở đúng trang
      // hãng (không chạy lệnh hộ — cài CLI cần quyền/UAC), kèm nút kiểm
      // tra lại để badge lật sang "đã cài" sau khi học viên cài xong
      if(!p.installed && p.install){
        const hint=(p.install.hint&&(p.install.hint[lang]||p.install.hint.vi))||'';
        const row=el(`<div style="margin:6px 0 0 26px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="mini-btn" type="button">${t('brainInstall')} ↗</button>
          <button class="mini-btn" type="button" data-re>${t('brainRecheck')}</button></div>
          <small class="note" style="margin:2px 0 8px 26px;display:block">${hint}</small>`);
        row.querySelector('button').onclick=e=>{ e.stopPropagation(); window.open(p.install.url,'_blank'); };
        row.querySelector('[data-re]').onclick=e=>{ e.stopPropagation();
          bfetch(BRIDGE+'/api/brain').then(r=>r.json()).then(d2=>{
            if((d2.presets||[]).some(x=>x.id===p.id&&x.installed))
              selBrain=p.id;      // tự chọn luôn — badge lật xanh là dấu hiệu
            show(d2);
          });
        };
        o.appendChild(row);
      }
      bl.appendChild(o);
    });
    const c=el(`<div class="opt${selBrain==='custom'?' sel':''}"><span class="flag">🛠️</span><div><b>${t('brainCustom')}</b><small>${t('brainCustomSub')}</small></div></div>`);
    c.onclick=()=>{ selBrain='custom'; show(d); };
    bl.appendChild(c);
    const custom=selBrain==='custom';
    s.querySelector('#bcwrap').style.display=custom?'':'none';
    s.querySelector('#bcnote').style.display=custom?'':'none';
    if(custom){ const i=s.querySelector('#bc'); i.value=customBrain; i.oninput=e=>customBrain=e.target.value; i.focus(); }
  };
  bfetch(BRIDGE+'/api/brain').then(r=>r.json()).then(show)
    .catch(()=>{ bl.innerHTML=`<p class="note">${t('errBridge')}</p>`; });
  s.querySelector('.ghost').onclick=()=>go(2);
  s.querySelector('#bn').onclick=async()=>{
    const err=s.querySelector('#be'); err.textContent='';
    let payload=null;
    if(selBrain==='custom'){
      const parts=customBrain.trim().split(/\s+/).filter(Boolean);
      if(!parts.length){ err.textContent=t('brainEmpty'); return; }
      payload={cmd:parts[0],args:parts.slice(1)};
    }else if(brainData&&brainData.current&&selBrain!==brainData.current.id){
      const picked=(brainData.presets||[]).find(p=>p.id===selBrain);
      if(picked&&!picked.installed){ err.textContent=t('brainNeedInstall'); return; }
      payload={id:selBrain};
    }
    if(!payload) return go(4);
    try{
      const r=await bfetch(BRIDGE+'/api/brain',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      const d=await r.json().catch(()=>({}));
      if(!r.ok){ err.textContent=d.err||t('brainErr'); return; }
      if(d.pending) needConfirm=true;   // đổi não giờ qua thẻ xác nhận (202)
      go(4);
    }catch(e){ err.textContent=t('errBridge'); }
  };
}

function stepFolder(){
  const s=document.getElementById('step');
  s.innerHTML=`<h1>${t('folder')}</h1><p class="lead">${t('folderLead')}</p><div class="opts cols" id="fl"></div>
    <div class="custom-row"><input type="text" id="cf" placeholder="${t('folderCustom')}"><button class="btn pri" id="cfbtn">+</button></div>
    <p class="note">${t('folderHint')}</p><p class="err" id="fe"></p>
    <div class="row" style="margin-top:22px"><button class="btn ghost">${t('back')}</button><button class="btn pri">${t('next')}</button></div>`;
  const fl=s.querySelector('#fl');
  function render(){
    fl.innerHTML='';
    [...FOLDER_PRESETS.map(p=>p.path), ...folders.filter(f=>!FOLDER_PRESETS.some(p=>p.path===f))].forEach(p=>{
      const c=el(`<label class="check${selFolders.has(p)?' sel':''}"><input type="checkbox"${selFolders.has(p)?' checked':''}><span></span></label>`);
      c.querySelector('span').textContent='📁 '+p;
      c.querySelector('input').onchange=e=>{ e.target.checked?selFolders.add(p):selFolders.delete(p); c.classList.toggle('sel',e.target.checked); };
      fl.appendChild(c);
    });
  }
  render();
  const addCustom=async()=>{
    const v=s.querySelector('#cf').value.trim();
    if(!v){ s.querySelector('#fe').textContent=t('errEmpty'); return; }
    try{
      // Chỉ KIỂM folder có tồn tại không — quyền thật ghi một lần ở bước
      // cuối bằng batch (POST /api/permissions giờ tạo thẻ xác nhận)
      const d=await bfetch(BRIDGE+'/api/check-path?path='+encodeURIComponent(v)).then(r=>r.json());
      if(d.isdir){ folders.push(v); selFolders.add(v); s.querySelector('#cf').value=''; s.querySelector('#fe').textContent=''; render(); }
      else s.querySelector('#fe').textContent=t('errFolder');
    }catch(e){ s.querySelector('#fe').textContent=t('errBridge'); }
  };
  s.querySelector('#cfbtn').onclick=addCustom;
  s.querySelector('#cf').onkeydown=e=>{ if(e.key==='Enter') addCustom(); };
  s.querySelector('.ghost').onclick=()=>go(3);
  s.querySelector('.row .pri').onclick=()=>go(5);
}

function stepApps(){
  const s=document.getElementById('step');
  s.innerHTML=`<h1>${t('apps')}</h1><p class="lead">${t('appsLead')}</p><div class="opts cols" id="al"></div>
    <p class="note">${t('appNote')}</p>
    <div class="row" style="margin-top:22px"><button class="btn ghost">${t('back')}</button><button class="btn pri" id="fin">${t('next')}</button></div>`;
  const al=s.querySelector('#al');
  // Danh sách preset + app nào trong connections.json mà preset chưa liệt kê thì hiện thêm
  bfetch(BRIDGE+'/api/connections').then(r=>r.json()).then(k=>{
    const have = new Set(APP_PRESETS.map(a=>a.id));
    (k.apps||[]).forEach(a=>{
      if(!have.has(a.id)) APP_PRESETS.push({id:a.id, vi:a.name||a.id, en:a.name||a.id});
    });
    renderApps();
  }).catch(()=>renderApps());
  function renderApps(){
    al.innerHTML='';
    APP_PRESETS.forEach(a=>{
      const c=el(`<label class="check${selApps.has(a.id)?' sel':''}"><input type="checkbox"${selApps.has(a.id)?' checked':''}><span></span></label>`);
      c.querySelector('span').textContent=a[lang];
      c.querySelector('input').onchange=e=>{ e.target.checked?selApps.add(a.id):selApps.delete(a.id); c.classList.toggle('sel',e.target.checked); };
      al.appendChild(c);
    });
  }
  s.querySelector('.ghost').onclick=()=>go(4);
  s.querySelector('#fin').onclick=finish;
}

async function finish(){
  const btn=document.getElementById('fin'); btn.disabled=true; btn.textContent=t('saving');
  needConfirm=false;
  try{
    const rs=await bfetch(BRIDGE+'/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({language:lang,learner_name:learnerName})});
    const ds=await rs.json().catch(()=>({}));
    if(ds.pending) needConfirm=true;
    // Tất cả folder gộp MỘT request = một thẻ xác nhận duy nhất
    if(selFolders.size){
      const rp=await bfetch(BRIDGE+'/api/permissions',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({paths:[...selFolders],access:'read'})}).catch(()=>null);
      const dp=rp?await rp.json().catch(()=>({})):{};
      if(dp.pending) needConfirm=true;
    }
    // App đã có trong connections.json → chạy probe; app chưa có → upsert đăng ký mới
    // (upsert mới dùng /api/connections — check-connection 404 với app chưa đăng ký)
    const k=await bfetch(BRIDGE+'/api/connections').then(r=>r.json()).catch(()=>({apps:[]}));
    const have=new Set((k.apps||[]).map(a=>a.id));
    for(const id of selApps){
      if(have.has(id)){
        await bfetch(BRIDGE+'/api/check-connection',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({id})}).catch(()=>{});
      }else{
        const p=APP_PRESETS.find(a=>a.id===id);
        await bfetch(BRIDGE+'/api/connections',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({app:{id,name:(p?p[lang]:id),type:(p&&p.type)||'browser',status:'not-connected'}})}).catch(()=>{});
      }
    }
    // Trợ lý theo nghề chọn ở gallery — tạo + activate SAU setup vì
    // activate đọc config.language để map skill vi→en đúng
    if(selTpl){
      const r=await bfetch(BRIDGE+'/api/bot',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'create',name:botName,role:selTpl.id,avatar:selTpl.avatar,
          skills:selTpl.skills,needs:selTpl.needs,recipes:selTpl.recipes,
          instructions:(selTpl.instructions&&selTpl.instructions[lang])||''})});
      const d=await r.json().catch(()=>({}));
      if(r.ok&&d.bot)
        await bfetch(BRIDGE+'/api/bot',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({action:'activate',id:d.bot.id})}).catch(()=>{});
    }
  }catch(e){ btn.disabled=false; btn.textContent=t('next'); return; }
  tryPairExt();   // setup xong → gửi mã kết nối cho extension (nếu đã cài)
  go(6);
}

function stepDone(){
  const s=document.getElementById('step');
  s.innerHTML=`<div class="done-check">🎓</div><h1 style="text-align:center">${t('done')}</h1>
    <p class="lead" style="text-align:center">${t('doneLead')}</p>
    ${needConfirm?`<p class="note" style="text-align:center">${t('pendingNote')}</p>`:''}
    <div class="row"><span></span><button class="btn pri">${t('start')}</button></div>`;
  s.querySelector('button').onclick=()=>{ location.href='index.html'; };
}

go(0);
tryPairExt();   // extension đã cài sẵn → nhận mã ngay, khỏi chờ bước cuối
</script>
