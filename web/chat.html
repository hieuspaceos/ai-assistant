<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat với trợ lý</title>
<link rel="stylesheet" href="vendor/fonts.css">
<style>
/* Hallmark · app screen · theme: Ultraviolet (deal 3/3) · redesign: full · scope: app — companion to styles.css */
@import url("vendor/tokens.css");
@import url("vendor/base.css");

:root { --mono: var(--font-outlier); }

body {
  height: 100vh; display: flex; flex-direction: column;
  font-size: var(--text-md);
}
/* chừa dải giấy phía dưới cho cụm nút chế độ nổi của portal cha —
   CHỈ khi modebar thật sự hiện (terminal bật); tắt → chat giãn hết */
body.has-modebar { padding-bottom: 52px; }

#messages {
  flex: 1; overflow-y: auto; padding: var(--space-lg) var(--space-md) var(--space-xs);
  display: flex; flex-direction: column; gap: var(--space-sm);
}
.msg {
  max-width: 82%; padding: var(--space-sm) var(--space-md); border-radius: var(--radius-card);
  line-height: 1.6; word-wrap: break-word;
}
.msg.user {
  align-self: flex-end;
  background: var(--color-accent);
  color: var(--color-accent-ink);
  border-bottom-right-radius: 4px; white-space: pre-wrap;
}
.msg.agent {
  align-self: flex-start; background: var(--color-paper-2); color: var(--color-ink);
  border-bottom-left-radius: 4px;
}
.msg.agent p { margin: 0 0 var(--space-xs); } .msg.agent p:last-child { margin-bottom: 0; }
.msg.agent ul, .msg.agent ol { margin: var(--space-2xs) 0 var(--space-sm) var(--space-lg); }
.msg.agent li { margin: var(--space-3xs) 0; }
.msg.agent code {
  background: var(--color-accent-soft); padding: var(--space-3xs) var(--space-xs); border-radius: 6px;
  font-size: var(--text-sm); font-family: var(--mono); color: var(--color-accent-deep);
}
.msg.agent pre {
  background: var(--color-ink); color: var(--color-paper); padding: var(--space-sm) var(--space-md);
  border-radius: var(--radius-card); overflow-x: auto; margin: var(--space-xs) 0;
}
.msg.agent pre code { background: none; color: inherit; padding: 0; }
.msg.agent h1,.msg.agent h2,.msg.agent h3 { margin: var(--space-sm) 0 var(--space-2xs); font-size: var(--text-lg); font-weight: 500;  }
.msg.agent strong { color: var(--color-accent-deep); }
.msg.agent table { border-collapse: collapse; margin: var(--space-xs) 0; font-size: var(--text-sm); }
.msg.agent th,.msg.agent td { border: var(--rule-hair) solid var(--color-rule); padding: var(--space-2xs) var(--space-sm); }
.msg.agent th { background: var(--color-paper-3); font-weight: 500; }
.msg.agent blockquote { border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); margin: var(--space-xs) 0; padding: var(--space-xs) var(--space-sm); color: var(--color-muted); }

.tool {
  align-self: flex-start; font-size: var(--text-xs); color: var(--color-muted);
  padding: 0 var(--space-sm); font-family: var(--mono);
}
.tool::before { content: "·"; color: var(--color-accent); font-weight: 700; margin-right: 6px; }
.tool.done { opacity: .55; }

/* permission card — hàng hairline + pill xin phép */
.perm {
  align-self: stretch; max-width: 82%;
  background: var(--color-paper-2);
  border-radius: var(--radius-card); padding: var(--space-sm) var(--space-md);
}
.perm .perm-title { font-size: var(--text-sm); color: var(--color-ink-2); margin-bottom: var(--space-sm); font-family: var(--mono); }
.perm .perm-btns { display: flex; gap: var(--space-xs); flex-wrap: wrap; }
.perm button {
  border: 0; background: none; color: var(--color-accent-deep);
  height: 32px; padding: 0 var(--space-md); border-radius: var(--radius-pill); cursor: pointer;
  font-size: var(--text-sm); font-weight: 500; font-family: var(--font-display); 
  box-shadow: inset 0 0 0 1.5px var(--color-rule-2);
  transition: background-color var(--dur-micro) var(--ease-out);
}
.perm button:hover { box-shadow: inset 0 0 0 1.5px var(--color-accent); }
.perm button.primary {
  background: var(--color-accent); color: var(--color-accent-ink);
  box-shadow: none;
}
.perm button.primary:hover { background: var(--color-accent-deep); }

.hint-chips { display: flex; gap: var(--space-xs); padding: 0 var(--space-md) var(--space-xs); flex-wrap: wrap; }
.hint-chips button {
  border: 0; color: var(--color-accent-deep);
  height: 32px; padding: 0 var(--space-md); border-radius: var(--radius-pill); cursor: pointer;
  font-size: var(--text-sm); font-weight: 500; font-family: var(--font-display); 
  background: none;
  box-shadow: inset 0 0 0 1.5px var(--color-rule-2);
  transition: background-color var(--dur-micro) var(--ease-out);
}
.hint-chips button:hover { box-shadow: inset 0 0 0 1.5px var(--color-accent); }
.hint-chips button:active { background: var(--color-paper-3); }
#send:active { background: var(--color-accent-deep); }

#inputbar {
  display: flex; gap: var(--space-sm); padding: var(--space-sm) var(--space-md);
  border-top: var(--rule-hair) solid var(--color-rule);
}
#input {
  flex: 1; border: 0; border-radius: var(--radius-card);
  min-height: 44px; max-height: 160px; padding: var(--space-sm) var(--space-md);
  font-size: var(--text-md); outline: none; resize: none;
  font-family: var(--font-display); line-height: 1.5;
  background: var(--color-paper-2); color: var(--color-ink);
  box-shadow: inset 0 0 0 1.5px var(--color-rule-2);
}
#input:focus-visible { outline: none; box-shadow: inset 0 0 0 1.5px var(--color-ink); }
#send {
  border: 0; border-radius: var(--radius-pill); align-self: flex-end;
  height: 44px; padding: 0 var(--space-lg); font-size: var(--text-md); font-weight: 500; cursor: pointer;
  font-family: var(--font-display); 
  background: var(--color-accent); color: var(--color-accent-ink);
  transition: background-color var(--dur-micro) var(--ease-out);
}
#send:hover { background: var(--color-accent-deep); }
#send:disabled { background: var(--color-paper-3); color: var(--color-muted); cursor: not-allowed; }
#status {
  font-size: var(--text-xs); color: var(--color-muted); padding: var(--space-2xs) var(--space-md) 0;
  display: none; font-family: var(--mono);
}
.thinking { opacity: .6; font-style: italic; }

/* bong bóng "đang gõ" — 3 chấm nhấp nhảy như người thật đang soạn tin */
.msg.typing { display: inline-flex; gap: 5px; align-items: center; padding: var(--space-sm) var(--space-md); }
.msg.typing i {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--color-muted); opacity: .35;
  animation: tdot 1.1s ease-in-out infinite;
}
.msg.typing i:nth-child(2) { animation-delay: .18s; }
.msg.typing i:nth-child(3) { animation-delay: .36s; }
@keyframes tdot { 0%, 60%, 100% { transform: translateY(0); opacity: .35; } 30% { transform: translateY(-4px); opacity: 1; } }

/* card xin phép đã hết hạn (replay sau restart) — vẽ mờ, khoá nút */
.perm.stale { opacity: .5; }
.perm.stale button { cursor: default; }

/* nút Việc mới — tròn nhỏ bên trái ô nhập */
#newtask {
  border: 0; border-radius: var(--radius-pill); align-self: flex-end;
  height: 44px; padding: 0 var(--space-md); font-size: var(--text-sm);
  font-weight: 500; cursor: pointer; font-family: var(--font-display);
  background: none; color: var(--color-accent-deep);
  box-shadow: inset 0 0 0 1.5px var(--color-rule-2);
  transition: box-shadow var(--dur-micro) var(--ease-out);
  white-space: nowrap;
}
#newtask:hover { box-shadow: inset 0 0 0 1.5px var(--color-accent); }
#newtask.confirm { background: var(--color-paper-3); color: var(--color-ink); }

/* chip "tin đang xếp" — tối đa 1 tin chờ trợ lý rảnh */
#queuechip {
  display: none; align-items: center; gap: var(--space-sm);
  padding: var(--space-2xs) var(--space-md); font-size: var(--text-xs);
  color: var(--color-muted); font-family: var(--mono);
}
#queuechip button {
  border: 0; background: none; color: var(--color-accent-deep);
  cursor: pointer; font-size: var(--text-sm); padding: 0 var(--space-2xs);
}

/* pill "↓ Tin mới" — chỉ hiện khi đang đọc tin cũ mà có tin về */
#newmsg {
  position: fixed; right: var(--space-md); bottom: 96px; z-index: 9;
  border: 0; border-radius: var(--radius-pill); height: 32px;
  padding: 0 var(--space-md); font-size: var(--text-sm); font-weight: 500;
  font-family: var(--font-display); cursor: pointer; display: none;
  background: var(--color-accent); color: var(--color-accent-ink);
  box-shadow: 0 2px 10px rgba(0,0,0,.18);
}

/* menu gợi ý /skill — mở khi gõ "/" đầu ô nhập */
#slashmenu {
  position: fixed; left: var(--space-md); bottom: 66px; z-index: 10;
  background: var(--color-paper); border-radius: var(--radius-card);
  box-shadow: 0 4px 18px rgba(0,0,0,.16); display: none;
  max-height: 240px; overflow-y: auto; min-width: 260px;
  padding: var(--space-2xs);
}
#slashmenu button {
  display: block; width: 100%; text-align: left; border: 0; background: none;
  padding: var(--space-xs) var(--space-sm); border-radius: 8px; cursor: pointer;
  font-size: var(--text-sm); font-family: var(--font-display); color: var(--color-ink);
}
#slashmenu button .sk { color: var(--color-accent-deep); font-family: var(--mono); }
#slashmenu button .ds { display: block; color: var(--color-muted); font-size: var(--text-xs); margin-top: 2px; }
#slashmenu button:hover, #slashmenu button.sel { background: var(--color-paper-2); }

/* chip 📂 bấm mở vị trí file/folder trợ lý nhắc tới */
.reveal-chip {
  border: 0; background: var(--color-paper-3); border-radius: 6px;
  font-size: .85em; cursor: pointer; padding: 0 5px; margin-left: 3px;
  color: var(--color-accent-deep); font-family: var(--font-display);
}
.reveal-chip:hover { background: var(--color-accent-soft); }
</style>
</head>
<body>
  <div id="status">Trợ lý đang làm việc…</div>
  <div id="messages"></div>
  <div class="hint-chips" id="chips"></div>
  <div id="queuechip"><span id="queue-text"></span><button id="queue-x" type="button" title="Huỷ tin đang xếp">×</button></div>
  <div id="inputbar">
    <button id="newtask" type="button" title="Bắt đầu việc mới — trợ lý quên hết phần trò chuyện này">＋</button>
    <textarea id="input" rows="1" placeholder="Nhắn cho trợ lý… (VD: /phong-van)" autocomplete="off"></textarea>
    <button id="send">Gửi</button>
  </div>
<button id="newmsg" type="button">↓ Tin mới</button>
<div id="slashmenu" role="listbox"></div>
<script src="bridge-token.js"></script>
<script>
// chỉ cho phép trỏ bridge về localhost — tham số lạ (link độc) bị bỏ qua
const BRIDGE = (() => {
  const b = new URLSearchParams(location.search).get('bridge') || 'http://localhost:7682';
  try {
    const u = new URL(b);
    if ((u.hostname === 'localhost' || u.hostname === '127.0.0.1') && u.protocol === 'http:')
      return 'http://' + u.host;
  } catch {}
  return 'http://localhost:7682';
})();
const msgs = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');
const chipsEl = document.getElementById('chips');
const newmsgBtn = document.getElementById('newmsg');
const queueChip = document.getElementById('queuechip');
const queueText = document.getElementById('queue-text');
const slashEl = document.getElementById('slashmenu');

// Chỉ tự cuộn xuống khi học viên đang ở sát đáy — đang đọc tin cũ mà
// tin mới trôi tới thì hiện pill "↓ Tin mới" thay vì giật màn hình.
function nearBottom() {
  return msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 80;
}
function scrollMaybe() {
  if (nearBottom() || replaying) {
    msgs.scrollTop = msgs.scrollHeight;
    newmsgBtn.style.display = 'none';
  } else newmsgBtn.style.display = 'block';
}
msgs.addEventListener('scroll', () => {
  if (nearBottom()) newmsgBtn.style.display = 'none';
});
newmsgBtn.onclick = () => {
  msgs.scrollTop = msgs.scrollHeight;
  newmsgBtn.style.display = 'none';
};

// modebar (nút Chat/Terminal nổi của portal cha) chỉ hiện khi terminal
// bật → cha báo qua postMessage; iframe mới load thì tự hỏi cha.
window.addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.t === 'modebar')
    document.body.classList.toggle('has-modebar', !!e.data.on);
});
try {
  if (window.parent !== window)
    window.parent.postMessage({t: 'modebar?'}, location.origin);
} catch {}

// chuỗi UI theo ngôn ngữ trong config (onboarding chọn vi/en)
const STR = {
  vi: {
    hints: [{label: 'Bắt đầu phỏng vấn', text: '/phong-van'},
            {label: 'Dạy mình một công cụ', text: '/huong-dan'},
            {label: 'Giúp em việc này…', text: ''}],
    hello: 'Xin chào! Mình là trợ lý AI của bạn. Bạn cứ nhắn như nhắn tin cho một người giúp việc.\n\nChưa biết bắt đầu từ đâu thì gõ **`/phong-van`**, mình sẽ hỏi vài câu rồi làm bộ công cụ riêng cho bạn.',
    helloBot: 'Xin chào! Mình là **{n}** — trợ lý của bạn. Bạn cứ nhắn như nhắn tin cho một người giúp việc.\n\nChưa biết bắt đầu từ đâu thì gõ **`/phong-van`**, mình sẽ hỏi vài câu rồi làm bộ công cụ riêng cho bạn.',
    ph: 'Nhắn cho trợ lý… (VD: /phong-van) · Enter gửi, Shift+Enter xuống dòng',
    send: 'Gửi', stop: '■ Dừng', busy: 'Trợ lý đang làm việc', permSuffix: ' — bạn cho phép không?',
    noOpt: 'Không đồng ý', errPfx: 'Ừm, có lỗi nhỏ: ',
    deadMsg: 'trợ lý đang tắt — mở lại app bằng file start rồi tải lại trang này',
    nativeHint: 'Xác nhận trong hộp thoại vừa hiện trên màn hình máy bạn — trợ lý không tự bấm được nút đó.',
    nativeTimeout: 'Hộp thoại tự đóng sau ~10 phút nếu không trả lời — khi đó việc đang làm sẽ dừng, bạn nhờ lại nhé.',
    newTask: '＋', newTaskSure: 'Chắc không?',
    newMsg: '↓ Tin mới', revealTitle: 'Mở vị trí này',
  },
  en: {
    hints: [{label: 'Start the interview', text: '/interview'},
            {label: 'Teach me a tool', text: '/guide'},
            {label: 'Help me with…', text: ''}],
    hello: 'Hi! I\'m your AI assistant — just message me like you\'d message a helpful coworker.\n\nNot sure where to start? Type **`/interview`** and I\'ll ask a few questions, then build tools just for you.',
    helloBot: 'Hi! I\'m **{n}** — your assistant. Just message me like you\'d message a helpful coworker.\n\nNot sure where to start? Type **`/interview`** and I\'ll ask a few questions, then build tools just for you.',
    ph: 'Message the assistant… (e.g. /interview) · Enter sends, Shift+Enter new line',
    send: 'Send', stop: '■ Stop', busy: 'The assistant is working', permSuffix: ' — allow it?',
    noOpt: 'Decline', errPfx: 'Hmm, small hiccup: ',
    deadMsg: 'the assistant is off — reopen the app with the start file, then reload this page',
    nativeHint: 'Confirm in the dialog on your screen — the assistant cannot click that button for you.',
    nativeTimeout: 'The dialog closes itself after ~10 minutes with no answer — the task then stops, just ask again.',
    newTask: '＋', newTaskSure: 'Sure?',
    newMsg: '↓ New', revealTitle: 'Open this location',
  },
};
let S = STR.vi;
function applyStrings() {
  chipsEl.innerHTML = '';
  S.hints.forEach(h => {
    const b = document.createElement('button');
    b.textContent = h.label;
    b.onclick = () => { input.value = h.text || input.value; input.focus(); };
    chipsEl.appendChild(b);
  });
  input.placeholder = S.ph;
  sendBtn.textContent = S.send;
  statusEl.textContent = S.busy;
  document.getElementById('newtask').textContent = S.newTask;
  document.getElementById('newmsg').textContent = S.newMsg;
}
applyStrings();
let botName = '';
bfetch(BRIDGE + '/api/config').then(r => r.json()).then(c => {
  if (c.language === 'en') { S = STR.en; applyStrings(); }
}).catch(() => {});
// bot active → lời chào mang tên riêng ("Hằng nghe đây")
bfetch(BRIDGE + '/api/bots').then(r => r.json()).then(b => {
  const act = (b.bots || []).find(x => x.id === b.active);
  if (act) botName = act.name;
}).catch(() => {});
function greeting() {
  return botName ? S.helloBot.replace('{n}', botName) : S.hello;
}

let curBubble = null;
function md(text) {
  if (window.marked && window.DOMPurify)
    return DOMPurify.sanitize(marked.parse(text, {breaks: true}));
  // thiếu thư viện (offline lần đầu) → chữ thường, không được để chat chết
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML.replace(/\n/g, '<br>');
}
function agentBubble() {
  curBubble = document.createElement('div');
  curBubble.className = 'msg agent';
  msgs.appendChild(curBubble);
  scrollMaybe();
  return curBubble;
}
// Stream render: trước đây marked.parse TOÀN VĂN mỗi chunk → O(n²) trên
// câu dài. Giờ tích raw + parse tối đa 1 lần/frame (rAF); replay history
// thì gom nguyên bubble rồi parse một lần khi đóng.
let rafId = 0;
let replaying = false;
function flushBubble() {
  // render ngay bubble đang dở — gọi trước khi curBubble bị đổi/null
  if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
  if (curBubble && curBubble.dataset.raw)
    curBubble.innerHTML = md(curBubble.dataset.raw);
    decoratePaths(curBubble);
  scrollMaybe();
}
function addText(t) {
  if (!curBubble) agentBubble();
  const b = curBubble;   // BẮT BUỘC capture — 'done'/'tool'/'addUser' có thể
  b.dataset.raw = (b.dataset.raw || '') + t;   // null hoá curBubble giữa chừng
  if (replaying) return; // replay: chỉ tích raw, flushBubble lo phần render
  if (!rafId) rafId = requestAnimationFrame(() => {
    rafId = 0;
    b.innerHTML = md(b.dataset.raw);   // đọc b đã capture, KHÔNG đọc curBubble
    decoratePaths(b);
    scrollMaybe();
  });
}
function addUser(t) {
  flushBubble();
  curBubble = null;
  const d = document.createElement('div');
  d.className = 'msg user'; d.textContent = t;
  msgs.appendChild(d); scrollMaybe();
}
let typingEl = null;
function addTyping() {
  removeTyping();
  typingEl = document.createElement('div');
  typingEl.className = 'msg agent typing';
  typingEl.innerHTML = '<i></i><i></i><i></i>';
  msgs.appendChild(typingEl);
  scrollMaybe();
}
function removeTyping() { if (typingEl) { typingEl.remove(); typingEl = null; } }

let busyAt = 0, busyTimer = null, lastTool = '';
function fmtBusy() {
  const s = Math.round((Date.now() - busyAt) / 1000);
  // việc agent vừa làm (tool mới nhất) + số giây — học viên thấy "nó đang chạy thật"
  const act = lastTool ? lastTool + ' · ' : '';
  return S.busy + '… ' + act + s + 's';
}
function startBusyClock() {
  busyAt = Date.now(); lastTool = '';
  statusEl.textContent = fmtBusy();
  clearInterval(busyTimer);
  busyTimer = setInterval(() => {
    statusEl.textContent = fmtBusy();
    // Bridge chết giữa lượt → không còn event done nào tới: busy kẹt mãi,
    // nút Gửi disabled luôn. Poll thất bại (connected=false) >20s = chắc
    // chắn chết (respawn xong poll sống lại → connected=true) → báo lỗi
    // + mở nút thay vì để học viên ngồi chờ.
    if (!connected && Date.now() - busyAt > 20000) {
      setBusy(false);
      clearQueue();
      addErr(S.deadMsg);
    }
  }, 1000);
}
function addTool(title, status) {
  flushBubble();
  curBubble = null;   // tool call = ranh giới tin nhắn → text sau mở bubble mới
  removeTyping();
  // KHÔNG vẽ dòng "Đang làm/Xong" vào khung chat — một việc chạy chục
  // tool call là rác màn hình; trạng thái sống nằm ở dòng busy trên
  // đầu (lastTool + giây), đủ cho học viên biết trợ lý đang chạy.
  if (status === 'in_progress' && title) {
    lastTool = title.slice(0, 60);
    if (busyTimer) statusEl.textContent = fmtBusy();
  }
}
function addPerm(ev) {
  const d = document.createElement('div');
  d.className = 'perm';
  d.dataset.permId = ev.id;   // perm_done từ bridge sẽ đóng card theo id này
  const t = document.createElement('div');
  t.className = 'perm-title';
  t.textContent = (ev.title || 'Trợ lý muốn làm một việc') + S.permSuffix;
  d.appendChild(t);
  // Card native (macOS): nút "Đồng ý" thật nằm trong hộp thoại hệ điều hành
  // — chat chỉ giải thích + cho nút "Không" để từ chối/đóng dialog.
  if (ev.native) {
    const h = document.createElement('div');
    h.className = 'perm-title';
    h.textContent = S.nativeHint;
    d.appendChild(h);
    const to = document.createElement('div');
    to.className = 'perm-title';
    to.style.opacity = '.75';
    to.style.fontSize = '.92em';
    to.textContent = S.nativeTimeout;
    d.appendChild(to);
  }
  const btns = document.createElement('div'); btns.className = 'perm-btns';
  // không có option nào → vẫn phải có nút, không thì agent chờ vô hạn
  const opts = ev.native
    ? [{name: S.noOpt, optionId: '__cancel__'}]
    : ((ev.options && ev.options.length)
       ? ev.options
       : [{name: S.noOpt, optionId: '__cancel__'}]);
  opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.textContent = o.name;
    if (i === 0 && !ev.native) b.className = 'primary';
    b.onclick = async () => {
      d.remove();
      // bridge giờ siết respond: id không còn pending → 404 (card replay từ
      // history, hoặc lượt đã đóng). Báo nhẹ thay vì im lặng gửi lệnh vô nghĩa.
      const res = await bfetch(BRIDGE + '/api/respond', {method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({id: ev.id, optionId: o.optionId})});
      if (!res.ok) addErr('yêu cầu xin phép đã hết hạn');
      // thẻ gate nội bộ (local-*) vừa chạy xong — báo trang ngoài làm mới
      // chip trợ lý / danh sách bài học (apply đổi bots.json, manifest…)
      else if (String(ev.id).startsWith('local-') && window.parent !== window)
        window.parent.postMessage({t: 'gateDone'}, location.origin);
    };
    btns.appendChild(b);
  });
  d.appendChild(btns); msgs.appendChild(d); scrollMaybe();
}
function addErr(msg) {
  const d = document.createElement('div');
  d.className = 'msg agent thinking';
  d.textContent = S.errPfx + msg;
  msgs.appendChild(d); scrollMaybe();
}
function setBusy(b) {
  statusEl.style.display = b ? 'block' : 'none';
  if (b) {
    startBusyClock(); addTyping();
    sendBtn.dataset.mode = 'stop'; sendBtn.textContent = S.stop;
  } else {
    clearInterval(busyTimer); busyTimer = null; removeTyping();
    sendBtn.dataset.mode = 'send'; sendBtn.textContent = S.send;
  }
}
async function cancelTurn() {
  // Bấm Dừng → bridge gửi session/cancel; não bơ thì lượt vẫn chạy tới
  // done — nút vẫn ở "Dừng" nhưng không treo vô hạn (done/err tới là về).
  try { await bfetch(BRIDGE + '/api/cancel', {method: 'POST'}); }
  catch (e) { setBusy(false); addErr(S.deadMsg); }
}
function say(t) { agentBubble(); curBubble.dataset.raw = t; curBubble.innerHTML = md(t); decoratePaths(curBubble); }

// Path trợ lý nhắc trong code (`...`) → kèm chip 📂 mở đúng vị trí đó
// qua /api/reveal (bridge tự guard: chỉ dưới ~, không vùng nhạy cảm).
const PATH_RE = /^(~[\/\\]|[A-Za-z]:[\/\\]|\/|workspace[\/\\]|[\w.\-]+[\/\\][\w.\-\\\/ ]*)$/;
function decoratePaths(el) {
  if (!el) return;
  el.querySelectorAll('code').forEach(c => {
    const t = (c.textContent || '').trim();
    if (c.dataset.chipped || t.length < 4 || t.length > 300 || !PATH_RE.test(t)) return;
    c.dataset.chipped = '1';
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'reveal-chip'; b.textContent = '📂';
    b.title = S.revealTitle;
    b.onclick = async () => {
      try {
        const r = await bfetch(BRIDGE + '/api/reveal', {method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({path: t})});
        const d = await r.json().catch(() => ({}));
        if (!r.ok || d.ok === false) addErr(d.err || 'không mở được chỗ này');
      } catch { addErr('không mở được — trợ lý đang tắt?'); }
    };
    c.appendChild(b);
  });
}

function grow() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
}
input.addEventListener('input', grow);
input.addEventListener('input', () => { slashIdx = 0; slashFilter(); });

// Dán ảnh (chụp màn hình…) → upload về workspace/inbox rồi chèn path
// vào ô nhập — não đọc được file trong vùng cho phép.
input.addEventListener('paste', e => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const it of items) {
    if (it.kind === 'file' && it.type.startsWith('image/')) {
      e.preventDefault();
      const f = it.getAsFile();
      const rd = new FileReader();
      rd.onload = async () => {
        try {
          const res = await bfetch(BRIDGE + '/api/upload-paste', {method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({data: rd.result, mime: f.type})});
          const d = await res.json().catch(() => ({}));
          if (res.ok && d.path) {
            input.value += (input.value && !input.value.endsWith(' ') ? ' ' : '') + d.path;
            grow();
          } else addErr(d.err || 'dán ảnh không được');
        } catch { addErr('dán ảnh không được — thử lại'); }
      };
      rd.readAsDataURL(f);
      return;
    }
  }
});

// Slash-menu: gõ "/" ở đầu ô → gợi ý skill đã cài (GET /api/skills)
let skillsCache = null, slashIdx = 0;
const escH = s => String(s).replace(/[&<>"']/g,
  c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
async function loadSkills() {
  if (skillsCache) return skillsCache;
  try {
    const d = await (await bfetch(BRIDGE + '/api/skills')).json();
    skillsCache = d.skills || [];
  } catch { skillsCache = []; }
  return skillsCache;
}
function slashFilter() {
  const m = /^\/([a-zA-Z0-9_-]*)$/.exec(input.value);
  if (!m) { slashEl.style.display = 'none'; return; }
  const q = m[1].toLowerCase();
  loadSkills().then(list => {
    const hits = list.filter(s => s.name.toLowerCase().includes(q)).slice(0, 8);
    if (!hits.length) { slashEl.style.display = 'none'; return; }
    slashEl.innerHTML = '';
    hits.forEach((s, i) => {
      const b = document.createElement('button');
      b.innerHTML = '<span class="sk">/' + escH(s.name) + '</span>' +
        (s.desc ? '<span class="ds">' + escH(s.desc) + '</span>' : '');
      if (i === slashIdx) b.classList.add('sel');
      b.onmousedown = e => { e.preventDefault(); pickSlash('/' + s.name); };
      slashEl.appendChild(b);
    });
    slashEl.style.display = 'block';
  });
}
function pickSlash(cmd) {
  input.value = cmd + ' ';
  slashEl.style.display = 'none';
  input.focus(); grow();
}
// Menu đang mở → phím điều hướng nuốt sự kiện (trả true); đóng → false.
function slashKey(e) {
  if (slashEl.style.display !== 'block') return false;
  const n = slashEl.children.length;
  if (!n) return false;
  if (e.key === 'ArrowDown') { slashIdx = (slashIdx + 1) % n; slashFilter(); return true; }
  if (e.key === 'ArrowUp') { slashIdx = (slashIdx - 1 + n) % n; slashFilter(); return true; }
  if (e.key === 'Tab' || e.key === 'Enter') {
    const sel = slashEl.children[slashIdx];
    if (sel) { e.preventDefault(); sel.dispatchEvent(new MouseEvent('mousedown')); }
    return true;
  }
  if (e.key === 'Escape') { slashEl.style.display = 'none'; return true; }
  return false;
}

let queuedMsg = null;   // tối đa 1 tin xếp chờ trợ lý rảnh
let pendingEcho = null; // tin mình vừa gửi — bridge bắn user_msg về → bỏ echo trùng
function queueMsg(t) {
  queuedMsg = t;
  queueText.textContent = '⏳ ' + (t.length > 60 ? t.slice(0, 60) + '…' : t);
  queueChip.style.display = 'flex';
}
function clearQueue() { queuedMsg = null; queueChip.style.display = 'none'; }
document.getElementById('queue-x').onclick = clearQueue;

async function send() {
  if (sendBtn.dataset.mode === 'stop') {
    // đang chạy → nút là Dừng; tin mới XẾP CHỜ (tối đa 1), tự gửi khi xong
    const t = input.value.trim();
    if (t) { input.value = ''; grow(); queueMsg(t); }
    return;
  }
  if (sendBtn.disabled) return;
  const t = input.value.trim();
  if (!t) return;
  input.value = '';
  grow();
  addUser(t);
  pendingEcho = t.slice(0, 4000);   // bridge cắt user_msg ở 4000 — khớp cùng biên
  setBusy(true);
  try {
    const res = await bfetch(BRIDGE + '/api/prompt', {method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text: t})});
    if (!res.ok) {
      // 409 bận / 503 não chết / 413… — res.ok phải check, im lặng là
      // học viên tưởng tin đã đi mà thực ra bridge từ chối
      const d = await res.json().catch(() => ({}));
      addErr(d.err || 'trợ lý chưa nhận được tin — thử lại nhé');
      setBusy(false);
      pendingEcho = null;   // bridge từ chối → không có user_msg về
    }
  } catch (e) {
    addErr('không nói chuyện được với trợ lý, thử tải lại trang');
    setBusy(false);
    pendingEcho = null;
  }
}

// Nút ＋ Việc mới — xác nhận 2 chạm (đổi nhãn 3s) rồi gọi /api/new-task;
// event "cleared" từ bridge sẽ tự xoá màn hình, khỏi dọn tay ở đây.
const newtaskBtn = document.getElementById('newtask');
newtaskBtn.onclick = async () => {
  if (!newtaskBtn.classList.contains('confirm')) {
    newtaskBtn.classList.add('confirm');
    newtaskBtn.textContent = S.newTaskSure;
    setTimeout(() => {
      newtaskBtn.classList.remove('confirm');
      newtaskBtn.textContent = S.newTask;
    }, 3000);
    return;
  }
  newtaskBtn.classList.remove('confirm');
  newtaskBtn.textContent = S.newTask;
  try {
    const res = await bfetch(BRIDGE + '/api/new-task', {method: 'POST'});
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      addErr(d.err || 'trợ lý đang bận — bấm Dừng trước đã');
    }
  } catch { addErr('không gọi được trợ lý — thử lại sau'); }
};
sendBtn.onclick = () =>
  (sendBtn.dataset.mode === 'stop') ? cancelTurn() : send();
// Enter = gửi, Shift+Enter = xuống dòng; isComposing = đang gõ dấu tiếng Việt/IME
input.addEventListener('keydown', e => {
  if (slashKey(e)) { e.preventDefault(); return; }
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});

function handleEvent(ev) {
  if (ev.t === 'ready') {
    if (!msgs.children.length) {
      say(greeting());
      curBubble = null;   // lời agent đầu tiên phải ra bubble riêng, không nối vào lời chào
    }
  }
  else if (ev.t === 'text') { removeTyping(); addText(ev.text); }
  else if (ev.t === 'tool') addTool(ev.title, ev.status);
  else if (ev.t === 'perm') { removeTyping(); flushBubble(); addPerm(ev); }
  else if (ev.t === 'user_msg') {
    // replay 2 chiều: tin học viên cũng nằm trong history. Tin MÌNH vừa
    // gửi được bridge echo lại → pendingEcho đánh dấu, bỏ bản trùng.
    if (pendingEcho !== null && ev.text === pendingEcho) pendingEcho = null;
    else addUser(ev.text);
  }
  else if (ev.t === 'cleared') {
    // "Việc mới" — xoá khung + tin đang xếp, chào lại như buổi đầu
    msgs.innerHTML = '';
    curBubble = null; pendingEcho = null; clearQueue();
    say(greeting());
    curBubble = null;
  }
  else if (ev.t === 'perm_done') {
    // bridge đã có quyết định (hộp thoại native/cancel) → đóng card treo
    // ev.id do não tự khai — có thể chứa " phá querySelector (SyntaxError
    // → poll loop đứt). So bằng dataset thay vì nối chuỗi vào selector.
    const c = [...msgs.querySelectorAll('[data-perm-id]')]
      .find(x => x.dataset.permId === String(ev.id));
    if (c) c.remove();
    // gate nội bộ vừa xong qua đường native — báo trang ngoài refresh
    // (refresh thừa khi cancel vẫn rẻ: 2 fetch)
    if (String(ev.id).startsWith('local-') && window.parent !== window)
      window.parent.postMessage({t: 'gateDone'}, location.origin);
  }
  else if (ev.t === 'done') {
    flushBubble(); setBusy(false); curBubble = null;
    // tin xếp chờ → gửi luôn khi lượt vừa xong
    if (queuedMsg) { const q = queuedMsg; clearQueue(); input.value = q; send(); }
  }
  else if (ev.t === 'err') {
    flushBubble(); addErr(ev.msg); setBusy(false);
    clearQueue();   // lỗi giữa chừng — tin xếp bỏ luôn, không tự thử lại
  }
  else if (ev.t === 'warn') addErr(ev.msg);   // cảnh báo bridge (VD hộp
  // thoại xin phép chết giữa chừng) — hiển thị như lỗi nhưng KHÔNG
  // setBusy(false): lượt não vẫn đang chạy
}

let since = 0;
let connected = false;
let pendingPermIds = null;   // id perm còn sống bridge báo khi reset
async function poll() {
  try {
    const t0 = Date.now();
    // long-poll: bridge giữ request tới khi có event (tối đa 25s) → độ trễ
    // hiển thị ~0 và không poll chặt mỗi giây nữa
    const res = await bfetch(BRIDGE + '/api/poll?since=' + since + '&wait=25000');
    if (!res.ok) throw new Error('bad');
    const data = await res.json();
    if (data.reset) {
      // bridge vừa restart (cursor cũ không còn hợp lệ) → dựng lại màn hình
      // và mở lại nút Gửi — nếu không nó kẹt disabled mãi sau khi bridge chết
      msgs.innerHTML = '';
      curBubble = null;
      setBusy(false);
      pendingEcho = null;   // reset = trạng thái mới — echo cũ không còn nghĩa
      pendingPermIds = new Set((data.perm_pending || []).map(String));
    }
    if (!connected) {
      connected = true;
      handleEvent({t: 'ready'});
    }
    since = data.next;
    // replay sau reset: addText chỉ tích raw (replaying), mỗi bubble đóng
    // mới parse 1 lần — tránh O(n²) y hệt chỗ stream khi lịch sử dài
    replaying = !!data.reset;
    (data.events || []).forEach(handleEvent);
    replaying = false;
    flushBubble();        // bubble cuối replay có thể đang mở dở
    if (pendingPermIds) {
      // card perm replay lên mà id không còn sống ở bridge → mờ + khoá
      // nút (bấm chỉ được 404 — mờ thì học viên hiểu ngay đã hết hạn)
      [...msgs.querySelectorAll('[data-perm-id]')].forEach(c => {
        if (!pendingPermIds.has(c.dataset.permId)) {
          c.classList.add('stale');
          c.querySelectorAll('button').forEach(b => { b.disabled = true; });
        }
      });
      pendingPermIds = null;
    }
    // Server bỏ qua `wait` (chat-bridge.ps1 — loop đơn luồng không giữ
    // request được) → trả rỗng ngay: phải tự nghỉ nhịp cũ, không lặp chặt.
    // Có event hoặc đã chờ lâu (long-poll thật) → repoll ngay để đón kịp.
    const had = (data.events || []).length > 0;
    setTimeout(poll, had || Date.now() - t0 >= 800 ? 0 : 900);
  } catch (e) {
    connected = false;
    setTimeout(poll, 4000);
  }
}
poll();
input.focus();
</script>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
</body>
